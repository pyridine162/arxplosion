<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子页面 - 详情</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 子页面额外的一点特定样式，为了省事直接写在这里 -->
    <style>
        .sub-header {
            margin: 50px auto 20px auto;
            max-width: 800px;
            text-align: left;
            border-bottom: 2px solid #fff;
            padding-bottom: 20px;
        }
        .content-body {
            max-width: 1000px;  
            padding: 40px;
            margin: 0 auto 1.5em auto;
            font-size: 1.15rem;
            line-height: 2;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            text-indent: 2em;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            border: 1px solid #555;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <!-- 返回主页的按钮 -->
    <a href="home.html" class="back-btn">← 返回枢纽</a>
    <div class="sub-header">
        <h1>角色</h1>
    </div>

    <div class="content-body">
        <p>这里还什么都没有喵。</p>
        <br>
        <p>1/1 页</p>
    
    </div>

</body>
</html>
