<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子页面 - 详情</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 子页面额外的一点特定样式，为了省事直接写在这里 -->
    <style>
        .sub-header {
            margin: 50px auto 20px auto;
            max-width: 800px;
            text-align: center;
            border-bottom: 2px solid #fff;
            padding-bottom: 20px;
        }
        .content-body {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
        }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            border: 1px solid #555;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="sub-header">
        <h1>模块标题（例如：地理介绍）</h1>
    </div>

    <div class="content-body">
        <p>这里输入你深邃、硬核的世界观内容。</p>
        <br>
        <p>你可以像写文章一样在这里换行。</p>
        <br>
        <p>—— 纪元 2045 年，记录者。</p>
        
        <!-- 返回主页的按钮 -->
        <a href="index.html" class="back-btn">← 返回枢纽</a>
    </div>

</body>
</html>
