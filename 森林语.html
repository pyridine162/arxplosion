<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子页面 - 详情</title>
    <link rel="stylesheet" href="style.css">
   
    <style>
        .sub-header {
            margin: 50px auto 20px auto;
            max-width: 800px;
            text-align: left;
            border-bottom: 2px solid #fff;
            padding-bottom: 20px;
        }
        .content-body {
            max-width: 1000px;  
            padding: 40px;
            margin: 0 auto 1.5em auto;
            font-size: 1.15rem;
            line-height: 2;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            text-indent: 2em;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            border: 1px solid #555;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- 返回主页的按钮 -->
    <a href="wiki.html" class="back-btn">← 返回</a>

    <!-- 标题区域，白线在标题下面 -->
    <div class="sub-header">
        <h1 style="text-align: center;">森林语</h1>
    </div>

    <!-- 正文区域 -->
    <div class="content-body">
        <p>流传在中原腹地的语言失传后，由位于南方森林的魔法文明重新传入北境、并成为进行魔法仪式时使用的主要语言被称为森林语。相应的文字被称为森林文。</p>
        <p>南方森林人的书写载体同符文刻录一致，由三方晶系、单斜晶系和三斜晶系结构的菱形矿石片镶嵌而成，因此字符多由斜向菱格组成。</p>
    </div>
    <img src="./images/rune.png" alt="示例图片" width=600px, style="display: block; margin: 0 auto;">
</body>
</html>
